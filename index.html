<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUST - Login Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-container">
        
        <div class="portal-header">
            <h1>MUST Online Portal</h1>
            <p>Mbarara University &bull; Faculty of Computing</p>
        </div>

        <!-- Login Form -->
        <form id="login-form">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" placeholder="applicant@must.ac.ug" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter password" required>

            <button type="submit">Log In</button>
        </form>

        <div style="text-align: center; margin-top: 15px;">
            <p style="font-size: 13px;">Don't have an account? <a href="details.html" style="color: #1a5276; text-decoration: none; font-weight: bold;">Register / Create Account</a></p>
        </div>

        <div class="footer">
            <p>Faculty of Computing & Informatics &bull; MUST</p>
        </div>

    </div>

   <script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault();

        // Get the email and password the user typed
        const enteredEmail = document.getElementById('login-email').value.trim();
        const enteredPassword = document.getElementById('login-password').value.trim();

        // Optional: Save what they typed so it's remembered
        if (enteredEmail) {
            localStorage.setItem('savedEmail', enteredEmail);
        }

        // Show success and move to the next page
        alert("Login successful! Welcome back.");
        window.location.href = "details.html";
    });
</script>
</body>
</html>
